// Tilt'Em body edit for Pytherea, exported 2026-10-04 08:04:08 UTC.
//
// PluginData is not read as configuration, which is why exports land here rather
// than taking effect on their own. Move this file into a GameData folder of your
// own to apply it, and delete whatever you did not mean to keep.

@Kopernicus:AFTER[TiltEm]
{
    @Body[Pytherea]
    {
        @Properties
        {
            // The legacy pair loses to poleRA/poleDec wherever a body has both,
            // so any pole already written for this body has to go first.
            !poleRA = delete
            !poleDec = delete
            %tiltx = 4.365946
            %tiltz = -1.613116
            %initialRotation = 148.760428
        }
    }
}
